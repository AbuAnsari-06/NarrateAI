<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NarrateAI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>NarrateAI</h1>
    <p class="hint">Highlight text on a page, right-click, and choose “Narrate with NarrateAI”.</p>

    <textarea id="text" rows="8" placeholder="Selected text appears here…"></textarea>

    <div class="row">
      <button id="play">▶ Play</button>
      <button id="pause">⏸ Pause</button>
      <button id="stop">⏹ Stop</button>
    </div>

    <label class="row">
      Speed
      <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" />
      <span id="rateLabel">1.0×</span>
    </label>

    <hr />

    <label>
      NarrateAI web app URL
      <input id="appUrl" type="url" placeholder="http://localhost:5173" />
    </label>
    <button id="openApp" class="primary">Open in NarrateAI (dynamic voices)</button>
    <p id="status" class="hint" role="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
